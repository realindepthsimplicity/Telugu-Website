<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telugu Learning Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0c;
      color: white;
    }
    .telugu-text {
      font-family: 'Noto Sans Telugu', 'Gautami', 'Akshar', sans-serif;
    }
    .display-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Responsive font scaling */
    :root {
      --font-scale: 1;
    }

    @media (max-width: 768px) {
      :root {
        --font-scale: 0.85;
      }
    }

    @media (max-width: 480px) {
      :root {
        --font-scale: 0.75;
      }
    }

    @media (max-width: 360px) {
      :root {
        --font-scale: 0.65;
      }
    }
  </style>
</head>
<body>
  <div id="root" style="min-height: 100vh; background: #0a0a0c; color: white; padding: 20px;">Loading...</div>
  <script type="text/babel">
    const { useState } = React;

    // Responsive font scaling function
    const getResponsiveSize = (baseSize) => {
      const scale = window.innerWidth < 768 ? 0.85 : 
                   window.innerWidth < 480 ? 0.75 : 
                   window.innerWidth < 360 ? 0.65 : 1;
      return `${parseFloat(baseSize) * scale}px`;
    };

    // Fallback if Motion doesn't load
    const Motion = window.FramerMotion || window.framerMotion || window.Motion;
    let motion, AnimatePresence;
    if (Motion) {
      motion = Motion.motion;
      AnimatePresence = Motion.AnimatePresence;
    } else {
      motion = new Proxy({}, { get: (target, prop) => prop });
      AnimatePresence = ({ children }) => children;
    }

    const BLUE = "#4c8dff";
    const ORANGE = "#ff8a3d";
    const PURPLE = "#b48bff";
    
    // Similar letter pair colors
    const PINK = "#f472b6";
    const YELLOW = "#fbbf24";
    const CYAN = "#22d3ee";
    const LAVENDER = "#a78bfa";
    const TEAL = "#14b8a6";

    // Dark mode colors
    const DARK_BG = "#0a0a0c";
    const DARK_TEXT = "white";
    const DARK_TEXT_SECONDARY = "rgba(255,255,255,0.5)";
    const DARK_BORDER = "rgba(255,255,255,0.1)";

    // Light mode colors
    const LIGHT_BG = "#ffffff";
    const LIGHT_TEXT = "#1a1a1a";
    const LIGHT_TEXT_SECONDARY = "rgba(0,0,0,0.6)";
    const LIGHT_BORDER = "rgba(0,0,0,0.1)";

    /* ------------------------- Page 1: the కో particle ------------------------- */

    const units = [
      {
        id: "unit-1",
        audio: "audio/vanta cheyi.m4a",
        teluguParts: [{ text: "వంట చేయి", color: BLUE }],
        translit: "vanṭa chēyi",
        englishParts: [{ text: "cook food", color: BLUE }],
      },
      {
        id: "unit-2",
        audio: "audio/vanta chesuko.m4a",
        teluguParts: [
          { text: "వంట చేసు", color: BLUE },
          { text: "కో", color: ORANGE },
        ],
        translit: "vanṭa chēsukō",
        englishParts: [
          { text: "cook food ", color: BLUE },
          { text: "for yourself", color: ORANGE },
        ],
      },
      {
        id: "unit-3",
        audio: "audio/chaduvu.m4a",
        teluguParts: [{ text: "చదువు", color: BLUE }],
        translit: "chaduvu",
        englishParts: [{ text: "read", color: BLUE }],
      },
      {
        id: "unit-4",
        audio: "audio/chaduvuko.m4a",
        teluguParts: [
          { text: "చదువు", color: BLUE },
          { text: "కో", color: ORANGE },
        ],
        translit: "chaduvukō",
        englishParts: [
          { text: "read ", color: BLUE },
          { text: "for yourself", color: ORANGE },
          { text: ";", color: ORANGE },
          { text: " study", color: BLUE },
        ],
      },
      {
        id: "unit-5",
        audio: "audio/techchu.m4a",
        teluguParts: [{ text: "తెచ్చు", color: BLUE }],
        translit: "techchu",
        englishParts: [{ text: "bring", color: BLUE }],
      },
      {
        id: "unit-6",
        audio: "audio/techchuko.m4a",
        teluguParts: [
          { text: "తెచ్చు", color: BLUE },
          { text: "కో", color: ORANGE },
        ],
        translit: "techchukō",
        englishParts: [
          { text: "bring ", color: BLUE },
          { text: "for yourself", color: ORANGE },
        ],
      },
      {
        id: "unit-7",
        audio: "audio/pettu.m4a",
        teluguParts: [{ text: "పెట్టు", color: BLUE }],
        translit: "peṭṭu",
        englishParts: [{ text: "keep", color: BLUE }],
      },
      {
        id: "unit-8",
        audio: "audio/pettuko.m4a",
        teluguParts: [
          { text: "పెట్టు", color: BLUE },
          { text: "కో", color: ORANGE },
        ],
        translit: "peṭṭukō",
        englishParts: [
          { text: "keep ", color: BLUE },
          { text: "for yourself", color: ORANGE },
        ],
      },
    ];

    const Unit = ({ unit, index, colors, darkMode }) => {
      const [loading, setLoading] = useState(false);

      const playAudio = async () => {
        if (loading) return;
        setLoading(true);
        try {
          const audio = new Audio(unit.audio);
          audio.onended = () => setLoading(false);
          audio.onerror = () => setLoading(false);
          await audio.play();
        } catch (e) {
          console.error("Audio playback failed", e);
          setLoading(false);
        }
      };

      return (
        <motion.div
          data-testid={unit.id}
          initial={{ opacity: 0, y: 40 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, margin: "-80px" }}
          transition={{ duration: 0.6, ease: [0.22, 1, 0.36, 1] }}
          className="relative w-full max-w-3xl"
          style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}
        >
          <div style={{ 
            position: 'absolute', 
            left: '-16px', 
            top: '50%', 
            transform: 'translateY(-50%)',
            fontSize: '14px',
            fontWeight: '500',
            letterSpacing: '0.3em',
            color: colors.textSecondary,
            display: window.innerWidth >= 768 ? 'block' : 'none'
          }}>
            {String(index + 1).padStart(2, "0")}
          </div>

          <div style={{
            borderRadius: window.innerWidth < 768 ? '16px' : '24px',
            border: `1px solid ${colors.border}`,
            background: colors.cardBg,
            padding: window.innerWidth < 768 ? '24px 32px' : '40px 56px',
            backdropFilter: 'blur(8px)',
            width: '100%',
            maxWidth: '768px'
          }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '16px' }}>
              <div
                data-testid={`${unit.id}-telugu`}
                className="telugu-text"
                style={{ fontSize: window.innerWidth < 768 ? '32px' : '48px', lineHeight: 1.1, color: colors.text }}
              >
                {unit.teluguParts.map((p, i) => (
                  <span key={i} style={{ color: p.color }}>
                    {p.text}
                  </span>
                ))}
              </div>

              <button
                data-testid={`${unit.id}-audio-btn`}
                onClick={playAudio}
                disabled={loading}
                aria-label={`Play pronunciation of ${unit.translit}`}
                style={{
                  marginTop: '8px',
                  display: 'flex',
                  height: '48px',
                  width: '48px',
                  alignItems: 'center',
                  justifyContent: 'center',
                  borderRadius: '50%',
                  border: `1px solid ${colors.border}`,
                  background: colors.cardBg,
                  color: colors.textSecondary,
                  cursor: loading ? 'not-allowed' : 'pointer',
                  transition: 'all 0.3s',
                  flexShrink: 0
                }}
                onMouseOver={(e) => {
                  if (!loading) {
                    e.target.style.borderColor = 'rgba(255,138,61,0.6)';
                    e.target.style.background = 'rgba(255,138,61,0.1)';
                    e.target.style.color = '#ff8a3d';
                  }
                }}
                onMouseOut={(e) => {
                  e.target.style.borderColor = colors.border;
                  e.target.style.background = colors.cardBg;
                  e.target.style.color = colors.textSecondary;
                }}
              >
                {loading ? (
                  <span style={{ animation: 'spin 1s linear infinite' }}>⟳</span>
                ) : (
                  <span>🔊</span>
                )}
              </button>
            </div>

            <div
              data-testid={`${unit.id}-translit`}
              style={{ marginTop: '12px', fontSize: window.innerWidth < 768 ? '14px' : '18px', fontStyle: 'italic', color: colors.textSecondary }}
            >
              {unit.translit}
            </div>

            <div style={{ margin: window.innerWidth < 768 ? '16px 0' : '28px 0', height: '1px', width: '64px', background: colors.border }} />

            <div
              data-testid={`${unit.id}-english`}
              className="display-text"
              style={{ fontSize: window.innerWidth < 768 ? '18px' : '24px', fontWeight: 600 }}
            >
              {unit.englishParts.map((p, i) => (
                <span key={i} style={{ color: p.color }}>
                  {p.text}
                </span>
              ))}
            </div>
          </div>
        </motion.div>
      );
    };

    const KoLesson = ({ colors, darkMode }) => (
      <div>
        <motion.header
          initial={{ opacity: 0, y: -20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.6 }}
          style={{ marginBottom: window.innerWidth < 768 ? '32px' : '56px', textAlign: 'center' }}
        >
          <h1 className="display-text" style={{ fontSize: window.innerWidth < 768 ? '32px' : '48px', fontWeight: 800, lineHeight: 1.1, color: colors.text }}>
            The <span className="telugu-text" style={{ color: ORANGE }}>కో</span> particle
          </h1>
          <p style={{ textAlign: 'left', maxWidth: window.innerWidth < 768 ? '100%' : '448px', margin: '20px auto 0', fontSize: window.innerWidth < 768 ? '14px' : '16px', color: colors.textSecondary }}>
            One small suffix turns an action into something you do{" "}
            <span style={{ color: ORANGE }}>for yourself</span>. Tap the speaker on any
            card to hear it spoken.
          </p>
        </motion.header>

        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '40px', width: '100%' }}>
          {units.map((unit, i) => (
            <Unit key={unit.id} unit={unit} index={i} colors={colors} darkMode={darkMode} />
          ))}
        </div>

        <div style={{ marginTop: '64px', display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'center', gap: '32px', fontSize: '14px', color: colors.textSecondary }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span style={{ height: '12px', width: '12px', borderRadius: '50%', backgroundColor: BLUE }} />
            base meaning
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span style={{ height: '12px', width: '12px', borderRadius: '50%', backgroundColor: ORANGE }} />
            reflexive particle కో
          </div>
        </div>
      </div>
    );

    /* ---------------------- Page 2: building letters (గుణింతం) ---------------------- */

    const CONSONANT = "క";
    const DOTTED = "\u25CC";

    const vowelRows = [
      ["అ", null, "ka", "Pure Telugu consonants by definition require a vowel to even exist, so they automatically have the most basic vowel, 'a' అ, in their uncombined forms. To combine a consonant with అ, you do not change it at all! That is why అ lacks a combining, subordinate form."],
      ["ఆ", "\u0C3E", "kā", null],
      ["ఇ", "\u0C3F", "ki", null],
      ["ఈ", "\u0C40", "kī", null],
      ["ఉ", "\u0C41", "ku", null],
      ["ఊ", "\u0C42", "kū", null],
      ["ఋ", "\u0C43", "kr", "The long r vowel (ౠ) is not included here as it is practically extinct in modern Telugu."],
      ["ఎ", "\u0C46", "ke", null],
      ["ఏ", "\u0C47", "kē", null],
      ["ఐ", "\u0C48", "kai", null],
      ["ఒ", "\u0C4A", "ko", null],
      ["ఓ", "\u0C4B", "kō", null],
      ["ఔ", "\u0C4C", "kau", null],
    ];

    const Op = ({ children, colors }) => (
      <span className="display-text" style={{ userSelect: 'none', fontSize: '24px', fontWeight: 300, color: colors.textSecondary }}>
        {children}
      </span>
    );

    const LetterRow = ({ vowel, matra, roman, note, index, colors, darkMode }) => {
      const combiningForm = matra ? DOTTED + matra : "అ";
      return (
        <motion.div
          data-testid={`row-${index + 1}`}
          initial={{ opacity: 0, y: 30 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, margin: "-60px" }}
          transition={{ duration: 0.5, ease: [0.22, 1, 0.36, 1] }}
          className="relative w-full max-w-3xl"
          style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}
        >
          <div style={{ 
            position: 'absolute', 
            left: '-16px', 
            top: '50%', 
            transform: 'translateY(-50%)',
            fontSize: '14px',
            fontWeight: '500',
            letterSpacing: '0.3em',
            color: colors.textSecondary,
            display: window.innerWidth >= 768 ? 'block' : 'none'
          }}>
            {String(index + 1).padStart(2, "0")}
          </div>

          <div style={{
            display: 'flex',
            alignItems: 'center',
            gap: window.innerWidth < 768 ? '8px' : '12px',
            overflowX: 'auto',
            borderRadius: '16px',
            border: `1px solid ${colors.border}`,
            background: colors.cardBg,
            padding: window.innerWidth < 768 ? '16px 24px' : '24px 40px',
            backdropFilter: 'blur(8px)',
            width: '100%',
            maxWidth: '768px'
          }}>
            <span
              className="telugu-text"
              style={{ fontSize: window.innerWidth < 768 ? '32px' : '48px', color: BLUE, flexShrink: 0 }}
            >
              {CONSONANT}
            </span>

            <Op colors={colors}>+</Op>

            <span
              className="telugu-text"
              style={{ fontSize: window.innerWidth < 768 ? '32px' : '48px', color: PURPLE, flexShrink: 0 }}
            >
              {vowel}
            </span>

            <Op colors={colors}>→</Op>

            <span
              className="telugu-text"
              style={{ fontSize: window.innerWidth < 768 ? '32px' : '48px', color: ORANGE, flexShrink: 0 }}
            >
              {combiningForm}
            </span>

            <Op colors={colors}>=</Op>

            <span
              data-testid={`row-${index + 1}-result`}
              className="telugu-text"
              style={{ fontSize: window.innerWidth < 768 ? '36px' : '56px', flexShrink: 0 }}
            >
              <span style={{ color: BLUE }}>{CONSONANT}</span>
              {matra && <span style={{ color: PURPLE }}>{matra}</span>}
            </span>

            <span style={{ marginLeft: 'auto', flexShrink: 0, paddingLeft: '16px', fontSize: window.innerWidth < 768 ? '14px' : '18px', fontStyle: 'italic', color: colors.textSecondary }}>
              {roman}
            </span>
          </div>
          {note && (
            <p style={{ marginTop: '12px', fontSize: '14px', color: colors.textSecondary, textAlign: 'center', maxWidth: '600px' }}>
              {note}
            </p>
          )}
        </motion.div>
      );
    };

    const ExerciseBox = ({ exercises, title, colors, darkMode, stickyPanel, setStickyPanel }) => {
      const [currentExercise, setCurrentExercise] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showRomanization, setShowRomanization] = useState(false);

      const handleNext = () => {
        setCurrentExercise((prev) => (prev + 1) % exercises.length);
        setShowAnswer(false);
        setSelectedOption(null);
        setShowRomanization(false);
      };

      const handlePrevious = () => {
        setCurrentExercise((prev) => (prev - 1 + exercises.length) % exercises.length);
        setShowAnswer(false);
        setSelectedOption(null);
        setShowRomanization(false);
      };

      const ExerciseContent = ({ exercise }) => {
        if (exercise.type === "reading") {
          return (
            <>
              <p className="telugu-text" style={{ fontSize: '32px', color: colors.text, marginBottom: '16px', lineHeight: 1.5 }}>
                {exercise.telugu}
              </p>
              {showRomanization && (
                <p style={{ fontSize: '14px', color: colors.textSecondary, marginBottom: '12px', fontStyle: 'italic' }}>
                  Romanization: {exercise.romanization}
                </p>
              )}
              <p style={{ fontSize: '16px', color: colors.textSecondary, maxWidth: '560px', margin: '0 auto' }}>
                {exercise.instruction}
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center', marginTop: '16px' }}>
                {setStickyPanel && (
                  <button
                    onClick={() => setStickyPanel(exercise.telugu)}
                    style={{
                      padding: '10px 20px',
                      borderRadius: '8px',
                      border: `1px solid ${colors.border}`,
                      background: colors.cardBg,
                      color: colors.text,
                      cursor: 'pointer',
                      fontSize: '14px',
                      transition: 'all 0.3s'
                    }}
                    onMouseOver={(e) => {
                      e.target.style.background = darkMode ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
                    }}
                    onMouseOut={(e) => {
                      e.target.style.background = colors.cardBg;
                    }}
                  >
                    Keep phrase visible while scrolling up / switching tabs
                  </button>
                )}
                <button
                  onClick={() => setShowRomanization(!showRomanization)}
                  style={{
                    padding: '10px 20px',
                    borderRadius: '8px',
                    border: `1px solid ${colors.border}`,
                    background: showRomanization ? 'rgba(76, 141, 255, 0.2)' : colors.cardBg,
                    color: colors.text,
                    cursor: 'pointer',
                    fontSize: '14px',
                    transition: 'all 0.3s'
                  }}
                  onMouseOver={(e) => {
                    e.target.style.background = darkMode ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
                  }}
                  onMouseOut={(e) => {
                    e.target.style.background = showRomanization ? 'rgba(76, 141, 255, 0.2)' : colors.cardBg;
                  }}
                >
                  {showRomanization ? "Hide Romanization" : "Show Romanization"}
                </button>
              </div>
            </>
          );
        }

        if (exercise.type === "fill-blank") {
          return (
            <>
              <p className="telugu-text" style={{ fontSize: '32px', color: colors.text, marginBottom: '16px', lineHeight: 1.5 }}>
                {exercise.telugu.replace("____", showAnswer ? exercise.answer : "____")}
              </p>
              <p style={{ fontSize: '14px', color: colors.textSecondary, marginBottom: '12px', fontStyle: 'italic' }}>
                Romanization: {exercise.romanization}
              </p>
              <p style={{ fontSize: '16px', color: colors.textSecondary, maxWidth: '560px', margin: '0 auto' }}>
                {exercise.instruction}
              </p>
              <button
                onClick={() => setShowAnswer(!showAnswer)}
                style={{
                  marginTop: '16px',
                  padding: '10px 20px',
                  borderRadius: '8px',
                  border: `1px solid ${colors.border}`,
                  background: showAnswer ? 'rgba(76, 141, 255, 0.2)' : colors.cardBg,
                  color: colors.text,
                  cursor: 'pointer',
                  fontSize: '14px',
                  transition: 'all 0.3s'
                }}
              >
                {showAnswer ? "Hide Answer" : "Show Answer"}
              </button>
            </>
          );
        }

        if (exercise.type === "multiple-choice") {
          return (
            <>
              {exercise.telugu ? (
                <>
                  <p className="telugu-text" style={{ fontSize: '32px', color: colors.text, marginBottom: '16px', lineHeight: 1.5 }}>
                    {exercise.telugu.replace("____", showAnswer ? exercise.answer : "____")}
                  </p>
                  <p style={{ fontSize: '14px', color: colors.textSecondary, marginBottom: '12px', fontStyle: 'italic' }}>
                    Romanization: {exercise.romanization}
                  </p>
                </>
              ) : (
                <>
                  <p style={{ fontSize: '24px', color: colors.text, marginBottom: '16px', lineHeight: 1.5, fontWeight: 600 }}>
                    {exercise.romanization}
                  </p>
                  <p style={{ fontSize: '14px', color: colors.textSecondary, marginBottom: '12px', fontStyle: 'italic' }}>
                    Select the correct Telugu script
                  </p>
                </>
              )}
              <p style={{ fontSize: '16px', color: colors.textSecondary, maxWidth: '560px', margin: '0 auto 16px' }}>
                {exercise.instruction}
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxWidth: '400px', margin: '0 auto' }}>
                {exercise.options.map((option, index) => (
                  <button
                    key={index}
                    onClick={() => setSelectedOption(index)}
                    style={{
                      padding: '12px 16px',
                      borderRadius: '8px',
                      border: `1px solid ${colors.border}`,
                      background: selectedOption === index 
                        ? (showAnswer 
                          ? (index === exercise.correctAnswer ? 'rgba(74, 222, 128, 0.3)' : 'rgba(251, 113, 133, 0.3)')
                          : 'rgba(76, 141, 255, 0.2)')
                        : colors.cardBg,
                      color: colors.text,
                      cursor: 'pointer',
                      fontSize: '14px',
                      textAlign: 'left',
                      transition: 'all 0.3s'
                    }}
                  >
                    {option}
                  </button>
                ))}
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center', marginTop: '16px' }}>
                {setStickyPanel && (
                  <button
                    onClick={() => setStickyPanel(exercise.options.join(' | '))}
                    style={{
                      padding: '10px 20px',
                      borderRadius: '8px',
                      border: `1px solid ${colors.border}`,
                      background: colors.cardBg,
                      color: colors.text,
                      cursor: 'pointer',
                      fontSize: '14px',
                      transition: 'all 0.3s'
                    }}
                    onMouseOver={(e) => {
                      e.target.style.background = darkMode ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
                    }}
                    onMouseOut={(e) => {
                      e.target.style.background = colors.cardBg;
                    }}
                  >
                    Keep choices visible while scrolling up / switching tabs
                  </button>
                )}
                <button
                  onClick={() => setShowAnswer(!showAnswer)}

              role: 'assistant',
              content: `Error: ${data.error || 'Unknown error'}`
            }]);

              role: 'assistant',
              content: `Here's ${exercises.length} practice exercise(s) for you:`
            }]);

              role: 'assistant',

              <motion.div
                key={index}
                initial={{ opacity: 0, y: 20 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true }}
                transition={{ duration: 0.4, delay: index * 0.05 }}
                style={{
                  borderRadius: '16px',
                  border: `1px solid ${colors.border}`,
                  background: colors.cardBg,
                  padding: '24px',
                  backdropFilter: 'blur(8px)'
                }}
              >
                <div style={{ marginBottom: '8px' }}>
                  <span style={{ 
                    fontSize: '12px', 
                    fontWeight: 600, 
                    letterSpacing: '0.05em',
                    color: BLUE,
                    textTransform: 'uppercase'
                  }}>
                    {word.category}
                  </span>
                </div>
                <div style={{ marginBottom: '12px' }}>
                  <span style={{ fontSize: '14px', color: colors.textSecondary, fontStyle: 'italic' }}>
                    English:
                  </span>
                  <span style={{ fontSize: '18px', fontWeight: 600, color: colors.text, marginLeft: '8px' }}>
                    {word.english}
                  </span>
                </div>
                <div style={{ marginBottom: '8px' }}>
                  <span style={{ fontSize: '14px', color: colors.textSecondary, fontStyle: 'italic' }}>
                    Telugu:
                  </span>
                  <span className="telugu-text" style={{ fontSize: '24px', fontWeight: 600, color: BLUE, marginLeft: '8px' }}>
                    {word.telugu}
                  </span>
                </div>
                <div>
                  <span style={{ fontSize: '12px', color: colors.textSecondary }}>
                    {word.translit}
                  </span>
                </div>
              </motion.div>
            ))}
          </div>
        </div>
      );
    };

    /* --------------------------------- Shell --------------------------------- */

    const TABS = [
      { id: "intro", label: "Home" },
      { id: "consonants", label: "Alphabet" },
      { id: "letters", label: "Building letters" },
      { id: "reading", label: "Reading practice" },
      { id: "ko", label: "The కో particle" },
      { id: "loanwords", label: "Writing in Standard Telugu" },
      { id: "chatbot", label: "AI Practice" },
    ];

    function App() {
      const [active, setActive] = useState("intro");
      const [darkMode, setDarkMode] = useState(true);
      const [stickyPanel, setStickyPanel] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 768);
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

      React.useEffect(() => {
        const handleResize = () => {
          const mobile = window.innerWidth < 768;
          setIsMobile(mobile);
          // On mobile, always close sidebar initially
          if (mobile) {
            setSidebarOpen(false);
          } else {
            // On desktop, open sidebar by default
            setSidebarOpen(true);
          }
        };

        // Initial check
        handleResize();

        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const colors = darkMode ? {
        bg: DARK_BG,
        text: DARK_TEXT,
        textSecondary: DARK_TEXT_SECONDARY,
        border: DARK_BORDER,
        cardBg: 'rgba(255,255,255,0.03)',
        popupBg: '#1a1a1e',
        overlayBg: 'rgba(0,0,0,0.7)',
        tabBg: 'rgba(0,0,0,0.4)',
        navBg: 'rgba(14,14,17,0.92)',
        navTextInactive: 'rgba(255,255,255,0.6)',
        navTextHover: '#ffffff',
        navTextActive: '#ffffff',
        glow1: 'rgba(76,141,255,0.2)',
        glow2: 'rgba(255,138,61,0.15)',
        glow3: 'rgba(180,139,255,0.1)'
      } : {
        bg: LIGHT_BG,
        text: LIGHT_TEXT,
        textSecondary: LIGHT_TEXT_SECONDARY,
        border: LIGHT_BORDER,
        cardBg: 'rgba(0,0,0,0.03)',
        popupBg: '#f5f5f5',
        overlayBg: 'rgba(0,0,0,0.5)',
        tabBg: 'rgba(0,0,0,0.05)',
        navBg: 'rgba(255,255,255,0.92)',
        navTextInactive: 'rgba(0,0,0,0.6)',
        navTextHover: '#1a1a1a',
        navTextActive: '#ffffff',
        glow1: 'rgba(76,141,255,0.1)',
        glow2: 'rgba(255,138,61,0.08)',
        glow3: 'rgba(180,139,255,0.05)'
      };

      React.useEffect(() => {
        document.body.style.background = colors.bg;
        document.body.style.color = colors.text;
        const rootEl = document.getElementById('root');
        if (rootEl) {
          rootEl.style.background = colors.bg;
          rootEl.style.color = colors.text;
        }
      }, [darkMode]);

      return (
        <div style={{ position: 'relative', minHeight: '100vh', overflow: 'hidden', background: colors.bg, color: colors.text }}>
          <div style={{ position: 'fixed', top: '-160px', left: '-160px', height: '384px', width: '384px', borderRadius: '50%', background: colors.glow1, filter: 'blur(120px)', pointerEvents: 'none' }} />
          <div style={{ position: 'fixed', bottom: '-160px', right: '-160px', height: '384px', width: '384px', borderRadius: '50%', background: colors.glow2, filter: 'blur(120px)', pointerEvents: 'none' }} />
          <div style={{ position: 'fixed', top: '33.33%', right: '25%', height: '288px', width: '288px', borderRadius: '50%', background: colors.glow3, filter: 'blur(120px)', pointerEvents: 'none' }} />

          {/* Overlay behind sidebar on mobile when open, tap to close */}
          {sidebarOpen && isMobile && (
            <div
              onClick={() => setSidebarOpen(false)}
              style={{
                position: 'fixed',
                inset: 0,
                zIndex: 25,
                background: 'rgba(0,0,0,0.5)'
              }}
            />
          )}

          {/* Expand button when sidebar is collapsed */}
          {!sidebarOpen && (
            <button
              onClick={() => setSidebarOpen(true)}
              style={{
                position: 'fixed',
                top: isMobile ? '20px' : '50%',
                left: '16px',
                transform: isMobile ? 'none' : 'translateY(-50%)',
                zIndex: 35,
                width: isMobile ? '44px' : '40px',
                height: isMobile ? '44px' : '40px',
                borderRadius: isMobile ? '12px' : '50%',
                border: `1px solid ${colors.border}`,
                background: colors.navBg,
                backdropFilter: 'blur(24px)',
                color: colors.text,
                fontSize: isMobile ? '20px' : '16px',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                transition: 'all 0.2s ease',
                boxShadow: darkMode ? '0 4px 12px rgba(0,0,0,0.3)' : '0 4px 12px rgba(0,0,0,0.1)'
              }}
              onMouseOver={(e) => {
                e.target.style.borderColor = BLUE;
                e.target.style.background = darkMode ? 'rgba(76,141,255,0.1)' : 'rgba(76,141,255,0.05)';
              }}
              onMouseOut={(e) => {
                e.target.style.borderColor = colors.border;
                e.target.style.background = colors.navBg;
              }}
              title="Expand sidebar"
            >
              {isMobile ? '☰' : '▶'}
            </button>
          )}

          {/* Sidebar navigation — fixed, so it stays visible regardless of scroll position */}
          <div style={{
            position: 'fixed',
            top: 0,
            left: 0,
            height: '100vh',
            width: '224px',
            zIndex: 30,
            display: 'flex',
            flexDirection: 'column',
            justifyContent: 'space-between',
            padding: '28px 16px',
            borderRight: `1px solid ${colors.border}`,
            background: colors.navBg,
            backdropFilter: 'blur(24px)',
            overflowY: 'auto',
            transform: sidebarOpen ? 'translateX(0)' : 'translateX(-100%)',
            transition: 'transform 0.25s ease'
          }}>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
              {TABS.map((tab) => (
                <button
                  key={tab.id}
                  data-testid={`tab-${tab.id}`}
                  onClick={() => { setActive(tab.id); if (isMobile) setSidebarOpen(false); }}
                  style={{
                    position: 'relative',
                    borderRadius: '12px',
                    padding: '12px 16px',
                    fontSize: '14px',
                    fontWeight: 500,
                    textAlign: 'left',
                    border: 'none',
                    background: 'transparent',
                    color: active === tab.id ? colors.navTextActive : colors.navTextInactive,
                    cursor: 'pointer',
                    transition: 'color 0.2s',
                    width: '100%'
                  }}
                  onMouseOver={(e) => {
                    if (active !== tab.id) {
                      e.target.style.color = colors.navTextHover;
                    }
                  }}
                  onMouseOut={(e) => {
                    if (active !== tab.id) {
                      e.target.style.color = colors.navTextInactive;
                    }
                  }}
                >
                  {active === tab.id && (
                    <motion.span
                      layoutId="tab-pill"
                      style={{
                        position: 'absolute',
                        inset: 0,
                        borderRadius: '12px',
                        background: BLUE
                      }}
                      transition={{ type: 'spring', stiffness: 380, damping: 32 }}
                    />
                  )}
                  <span style={{ position: 'relative', zIndex: 10 }}>
                    {tab.label}
                  </span>
                </button>
              ))}
            </div>

            {/* Dark mode toggle */}
            <button
              onClick={() => setDarkMode(!darkMode)}
              style={{
                padding: '10px 16px',
                borderRadius: '9999px',
                border: `1px solid ${colors.border}`,
                background: colors.tabBg,
                color: colors.text,
                fontSize: '14px',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: '8px',
                backdropFilter: 'blur(24px)',
                width: '100%'
              }}
            >
              {darkMode ? '☀️ Light mode' : '🌙 Dark mode'}
            </button>

            {/* Sidebar collapse button */}
            <button
              onClick={() => setSidebarOpen(!sidebarOpen)}
              style={{
                marginTop: '12px',
                padding: '10px 16px',
                borderRadius: '9999px',
                border: `1px solid ${colors.border}`,
                background: colors.tabBg,
                color: colors.text,
                fontSize: '14px',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: '8px',
                backdropFilter: 'blur(24px)',
                width: '100%',
                transition: 'all 0.2s ease'
              }}
              onMouseOver={(e) => {
                e.target.style.borderColor = BLUE;
                e.target.style.background = darkMode ? 'rgba(76,141,255,0.1)' : 'rgba(76,141,255,0.05)';
              }}
              onMouseOut={(e) => {
                e.target.style.borderColor = colors.border;
                e.target.style.background = colors.tabBg;
              }}
              title={sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'}
            >
              {sidebarOpen ? '◀ Collapse' : '▶ Expand'}
            </button>
          </div>

            <main style={{
            position: 'relative',
            zIndex: 10,
            marginLeft: sidebarOpen && !isMobile ? '224px' : '0',
            width: sidebarOpen && !isMobile ? 'calc(100% - 224px)' : '100%',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            padding: isMobile ? '80px 16px 96px 16px' : '48px 48px 96px 48px',
            transition: 'margin-left 0.25s ease, width 0.25s ease'
          }}>
            <div style={{ width: '100%', maxWidth: '896px', display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
            <AnimatePresence mode="wait">
              <motion.div
                key={active}
                data-testid={`page-${active}`}
                initial={{ opacity: 0, y: 12 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: -12 }}
                transition={{ duration: 0.3 }}
                style={{ width: '100%' }}
              >
                {active === "ko" ? <KoLesson colors={colors} darkMode={darkMode} /> : active === "loanwords" ? <Loanwords colors={colors} darkMode={darkMode} /> : active === "letters" ? <LettersLesson colors={colors} darkMode={darkMode} stickyPanel={stickyPanel} setStickyPanel={setStickyPanel} /> : active === "reading" ? <ReadingPractice colors={colors} darkMode={darkMode} stickyPanel={stickyPanel} setStickyPanel={setStickyPanel} /> : active === "intro" ? <IntroLesson setActive={setActive} colors={colors} darkMode={darkMode} /> : active === "chatbot" ? <ChatBot colors={colors} darkMode={darkMode} /> : <ConsonantsLesson setActive={setActive} colors={colors} darkMode={darkMode} stickyPanel={stickyPanel} setStickyPanel={setStickyPanel} />}
              </motion.div>
            </AnimatePresence>
            </div>
          </main>

          {stickyPanel && (
            <motion.div
              initial={{ opacity: 0, x: 300 }}
              animate={{ opacity: 1, x: 0 }}
              exit={{ opacity: 0, x: 300 }}
              style={{
                position: 'fixed',
                right: '20px',
                top: '50%',
                transform: 'translateY(-50%)',
                width: '320px',
                padding: '24px',
                borderRadius: '16px',
                background: darkMode ? 'rgba(10,10,12,0.95)' : 'rgba(255,255,255,0.95)',
                border: `1px solid ${colors.border}`,
                backdropFilter: 'blur(16px)',
                zIndex: 1000,
                boxShadow: darkMode ? '0 8px 32px rgba(0,0,0,0.4)' : '0 8px 32px rgba(0,0,0,0.1)'
              }}
            >
              <button
                onClick={() => setStickyPanel(null)}
                style={{
                  position: 'absolute',
                  top: '12px',
                  right: '12px',
                  background: 'none',
                  border: 'none',
                  color: colors.textSecondary,
                  fontSize: '20px',
                  cursor: 'pointer',
                  padding: '4px'
                }}
              >
                ×
              </button>
              <p style={{ fontSize: '14px', color: colors.textSecondary, marginBottom: '12px' }}>
                Test phrase:
              </p>
              <p className="telugu-text" style={{ fontSize: '24px', color: colors.text, lineHeight: 1.6 }}>
                {stickyPanel}
              </p>
            </motion.div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    
    try {
      root.render(<App />);
    } catch (error) {
      console.error('Error rendering app:', error);
      document.getElementById('root').innerHTML = `
        <div style="color: white; padding: 20px;">
          <h1>Error loading app</h1>
          <pre style="color: #ff6b6b;">${error.message}</pre>
          <pre style="color: #888;">${error.stack}</pre>
        </div>
      `;
    }
  </script>
</body>
</html>
